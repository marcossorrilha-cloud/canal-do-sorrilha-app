name: Atualizar clipping (Substack)

# Roda a cada 15 min (deslocado do workflow principal) para o clipping novo aparecer
# rápido depois que você publica no Substack. Também dá para disparar na mão em
# Actions -> Run workflow logo após postar, para atualização quase imediata.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # 4x por hora (UTC), fora do minuto 0
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: atualizar-clipping
  cancel-in-progress: false

jobs:
  clipping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: node fetch-clipping.mjs
        continue-on-error: true
      - name: Commitar se mudou
        run: |
          git config user.name "canal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add clipping.json
          if git diff --cached --quiet; then
            echo "Sem mudanças no clipping."
          else
            git commit -m "chore(clipping): atualização $(date -u +'%Y-%m-%dT%H:%MZ')"
            git pull --rebase --autostash origin main || true
            git push
          fi
