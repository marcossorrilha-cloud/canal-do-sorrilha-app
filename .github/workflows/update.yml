name: Atualizar conteúdo do app

# Roda de hora em hora: notícias (Em tempo real), aprovação de Trump e Blind Spot.
# O clipping tem workflow próprio (clipping.yml), mais frequente.
# Cada arquivo só gera commit se realmente mudou.
on:
  schedule:
    - cron: "0 * * * *"      # toda hora cheia (UTC)
  workflow_dispatch:
    inputs:
      approval:
        description: "Trump — Aprovação % (opcional)"
        required: false
      disapproval:
        description: "Trump — Desaprovação % (opcional)"
        required: false
      net:
        description: "Trump — Saldo líquido (opcional)"
        required: false
      trend:
        description: "Trump — Texto de tendência (opcional)"
        required: false

permissions:
  contents: write

concurrency:
  group: atualizar-conteudo
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund

      - name: Coletar notícias
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: node fetch-news.mjs
        continue-on-error: true

      - name: Coletar clipping (Substack)
        run: node fetch-clipping.mjs
        continue-on-error: true

      - name: Atualizar aprovação de Trump
        env:
          TRUMP_APPROVAL: ${{ github.event.inputs.approval }}
          TRUMP_DISAPPROVAL: ${{ github.event.inputs.disapproval }}
          TRUMP_NET: ${{ github.event.inputs.net }}
          TRUMP_TREND: ${{ github.event.inputs.trend }}
        run: node fetch-trump.mjs
        continue-on-error: true

      - name: Calcular Blind Spot (2x/dia)
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: node fetch-blindspot.mjs
        continue-on-error: true

      - name: Commitar o que mudou
        run: |
          git config user.name "canal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json clipping.json trump.json blindspot.json
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "chore: atualização automática $(date -u +'%Y-%m-%dT%H:%MZ')"
            git pull --rebase --autostash origin main || true
            git push
          fi
